<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ats-cv-check demo</title>
  <meta name="description" content="Deterministic CV checker demo. No AI, no network: everything runs in your browser.">
  <style>
    :root {
      --bg: #fbfbfa;
      --fg: #1c1c1a;
      --muted: #6b6b66;
      --line: #deded9;
      --card: #ffffff;
      --accent: #1f4fd8;
      --good: #1f8a4c;
      --warn: #b7791f;
      --bad: #c0392b;
      --font: system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131312; --fg: #ecece8; --muted: #9a9a93; --line: #2c2c29; --card: #1b1b19;
        --accent: #7c9cff; --good: #4cc27f; --warn: #e0a64a; --bad: #ef7466;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--font); }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 24px; font-weight: 500; margin: 0 0 8px; }
    h2 { font-size: 16px; font-weight: 500; margin: 28px 0 8px; }
    p { margin: 0 0 12px; }
    a { color: var(--accent); }
    .muted { color: var(--muted); font-size: 14px; }
    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    .langs { display: flex; gap: 4px; }
    button {
      font: 500 14px var(--font); color: var(--fg); background: var(--card);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer;
    }
    button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 16px 0 6px; }
    textarea {
      width: 100%; min-height: 200px; resize: vertical; padding: 12px; background: var(--card); color: var(--fg);
      border: 1px solid var(--line); border-radius: 8px; font: 400 14px/1.5 var(--mono);
    }
    textarea#jd { min-height: 96px; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    #results { margin-top: 8px; }
    .score-row { display: flex; align-items: baseline; gap: 12px; margin-top: 32px; }
    .score { font-size: 32px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .score-label { color: var(--muted); font-size: 14px; }
    ul { list-style: none; padding: 0; margin: 0; }
    .bars li { display: grid; grid-template-columns: 170px 1fr 36px; align-items: center; gap: 12px; padding: 4px 0; font-size: 14px; }
    .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .fill { display: block; height: 100%; background: var(--accent); }
    .bar-value { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    .finding { display: grid; grid-template-columns: 12px 1fr; column-gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
    .finding .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 8px; background: var(--good); }
    .finding.warning .dot { background: var(--warn); }
    .finding.critical .dot { background: var(--bad); }
    .finding-title { grid-column: 2; font-weight: 500; }
    .finding-fix { grid-column: 2; color: var(--muted); font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips li { font: 400 14px var(--mono); padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
    footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); }
    @media (max-width: 480px) { .bars li { grid-template-columns: 120px 1fr 32px; } }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1>ats-cv-check</h1>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-locale="en" aria-pressed="true">EN</button>
        <button type="button" data-locale="sv" aria-pressed="false">SV</button>
        <button type="button" data-locale="fr" aria-pressed="false">FR</button>
      </div>
    </div>
    <p id="lead" class="muted"></p>

    <label for="cv" id="cv-label"></label>
    <textarea id="cv" spellcheck="false" autocomplete="off"></textarea>
    <label for="jd" id="jd-label"></label>
    <textarea id="jd" spellcheck="false" autocomplete="off"></textarea>

    <div class="actions">
      <button type="button" id="check" class="primary"></button>
      <button type="button" id="sample"></button>
    </div>

    <div id="results" aria-live="polite"></div>

    <footer>
      <p><a id="hosted-link" href="https://nextcv.net/en/cv-check"></a></p>
      <p class="muted"><a href="https://github.com/hasuwini77/ats-cv-check">Source on GitHub</a> · MIT</p>
    </footer>
  </main>
  <script src="checker.js"></script>
</body>
</html>
