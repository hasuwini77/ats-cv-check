name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built demo is up to date
        run: git diff --exit-code -- demo/checker.js
      - name: Built package imports and scores
        run: |
          node --input-type=module -e "
          import { checkCv, getSampleCvText, describeFinding } from './dist/index.js';
          const r = checkCv({ text: getSampleCvText('sv'), locale: 'sv' });
          if (r.score < 70) throw new Error('unexpected score ' + r.score);
          console.log(r.score, describeFinding(r.findings[0], 'sv').title);
          "
